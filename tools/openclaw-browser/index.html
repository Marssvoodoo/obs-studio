<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Browser Control</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f1f2f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(42, 89, 114, 0.3), transparent 35%),
        linear-gradient(215deg, rgba(101, 56, 57, 0.28), transparent 34%),
        #101114;
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 56px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .status {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #30343b;
      border-radius: 8px;
      background: rgba(16, 17, 20, 0.7);
      text-align: right;
    }

    .status strong {
      display: block;
      font-size: 14px;
      color: #9fd4ff;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
    }

    section {
      border-top: 1px solid #343941;
      padding-top: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      color: #a8adb7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #c7cad1;
    }

    input,
    select,
    button {
      box-sizing: border-box;
      width: 100%;
      min-height: 40px;
      border: 1px solid #373d46;
      border-radius: 7px;
      background: #17191e;
      color: #f1f2f4;
      font: inherit;
    }

    input,
    select {
      padding: 0 10px;
      margin-bottom: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }

    button:hover:not(:disabled) {
      border-color: #78bdf5;
      background: #20252c;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .danger {
      border-color: #7b4148;
      color: #ffc5cc;
    }

    .scene-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .scene-list button {
      min-height: 56px;
      text-align: left;
      padding: 0 12px;
    }

    .scene-list button.active {
      border-color: #88d18a;
      background: #1c2a20;
      color: #d9ffdc;
    }

    pre {
      min-height: 160px;
      max-height: 280px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      border: 1px solid #30343b;
      border-radius: 8px;
      background: rgba(11, 12, 14, 0.76);
      color: #cbd0d9;
      white-space: pre-wrap;
    }

    @media (max-width: 780px) {
      header,
      .grid {
        grid-template-columns: 1fr;
        display: grid;
      }

      .status {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>OpenClaw</h1>
      <div class="status">
        <strong id="state">Disconnected</strong>
        <span id="details">OBS WebSocket :4455</span>
      </div>
    </header>

    <div class="grid">
      <section>
        <h2>Connection</h2>
        <label for="url">WebSocket URL</label>
        <input id="url" value="ws://127.0.0.1:4455">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="off" placeholder="Leave blank when auth is off">
        <div class="actions">
          <button id="connect">Connect</button>
          <button id="disconnect" disabled>Disconnect</button>
        </div>
      </section>

      <section>
        <h2>Controls</h2>
        <div class="actions">
          <button id="stream" disabled>Toggle Stream</button>
          <button id="record" disabled>Toggle Record</button>
          <button id="refresh" disabled>Refresh Scenes</button>
          <button id="studio" disabled>Toggle Studio Mode</button>
        </div>
      </section>
    </div>

    <section style="margin-top: 24px;">
      <h2>Scenes</h2>
      <div id="scenes" class="scene-list"></div>
    </section>

    <section style="margin-top: 24px;">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script>
    const OP_HELLO = 0;
    const OP_IDENTIFY = 1;
    const OP_IDENTIFIED = 2;
    const OP_EVENT = 5;
    const OP_REQUEST = 6;
    const OP_RESPONSE = 7;

    const state = document.querySelector("#state");
    const details = document.querySelector("#details");
    const logEl = document.querySelector("#log");
    const scenesEl = document.querySelector("#scenes");
    const buttons = {
      connect: document.querySelector("#connect"),
      disconnect: document.querySelector("#disconnect"),
      stream: document.querySelector("#stream"),
      record: document.querySelector("#record"),
      refresh: document.querySelector("#refresh"),
      studio: document.querySelector("#studio"),
    };

    let socket;
    let requestId = 1;
    let activeScene = "";

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${message}\n${logEl.textContent}`.slice(0, 6000);
    }

    function setConnected(isConnected) {
      state.textContent = isConnected ? "Connected" : "Disconnected";
      buttons.connect.disabled = isConnected;
      buttons.disconnect.disabled = !isConnected;
      buttons.stream.disabled = !isConnected;
      buttons.record.disabled = !isConnected;
      buttons.refresh.disabled = !isConnected;
      buttons.studio.disabled = !isConnected;
    }

    function send(payload) {
      socket.send(JSON.stringify(payload));
    }

    function request(requestType, requestData = {}) {
      const id = String(requestId++);
      send({ op: OP_REQUEST, d: { requestType, requestId: id, requestData } });
      return id;
    }

    function renderScenes(scenes) {
      scenesEl.innerHTML = "";
      scenes.forEach((scene) => {
        const button = document.createElement("button");
        button.textContent = scene.sceneName;
        button.className = scene.sceneName === activeScene ? "active" : "";
        button.onclick = () => {
          request("SetCurrentProgramScene", { sceneName: scene.sceneName });
          activeScene = scene.sceneName;
          renderScenes(scenes);
        };
        scenesEl.appendChild(button);
      });
    }

    function refreshScenes() {
      request("GetSceneList");
    }

    buttons.connect.onclick = () => {
      const url = document.querySelector("#url").value.trim();
      const password = document.querySelector("#password").value;

      socket = new WebSocket(url);
      socket.onopen = () => {
        details.textContent = url;
        log("Socket opened");
      };
      socket.onclose = () => {
        setConnected(false);
        log("Socket closed");
      };
      socket.onerror = () => log("Socket error. Check that OBS is running and WebSocket Server is enabled.");
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);

        if (message.op === OP_HELLO) {
          if (message.d.authentication && !password) {
            log("OBS requires a password. Enter it and reconnect.");
            socket.close();
            return;
          }
          send({
            op: OP_IDENTIFY,
            d: {
              rpcVersion: message.d.rpcVersion,
              eventSubscriptions: 33,
            },
          });
        }

        if (message.op === OP_IDENTIFIED) {
          setConnected(true);
          log("Identified with OBS");
          refreshScenes();
          request("GetVersion");
        }

        if (message.op === OP_EVENT) {
          if (message.d.eventType === "CurrentProgramSceneChanged") {
            activeScene = message.d.eventData.sceneName;
            refreshScenes();
          }
          log(`Event: ${message.d.eventType}`);
        }

        if (message.op === OP_RESPONSE) {
          const { requestType, requestStatus, responseData } = message.d;
          if (!requestStatus.result) {
            log(`${requestType} failed: ${requestStatus.comment || "unknown error"}`);
            return;
          }
          if (requestType === "GetSceneList") {
            activeScene = responseData.currentProgramSceneName;
            renderScenes(responseData.scenes || []);
          } else if (requestType === "GetVersion") {
            log(`OBS ${responseData.obsVersion}, obs-websocket ${responseData.obsWebSocketVersion}`);
          } else {
            log(`${requestType} OK`);
          }
        }
      };
    };

    buttons.disconnect.onclick = () => socket && socket.close();
    buttons.stream.onclick = () => request("ToggleStream");
    buttons.record.onclick = () => request("ToggleRecord");
    buttons.refresh.onclick = refreshScenes;
    buttons.studio.onclick = () => request("ToggleStudioMode");
  </script>
</body>
</html>
